<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WindowSystem v2.0</title>

    <style>
        :root {
            --gray: #d4d0c8;
            --dark: #808080;
            --white: #fff;
            --blue: #000080;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #008080;
            font-family: "MS Sans Serif", Tahoma, sans-serif;
            font-size: 12px;
        }

        .ventana {
            width: min(760px, calc(100vw - 20px));
            height: min(560px, calc(100vh - 20px));
            display: flex;
            flex-direction: column;
            background: var(--gray);
            border-top: 2px solid var(--white);
            border-left: 2px solid var(--white);
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            padding: 3px;
        }

        .titulo {
            height: 24px;
            display: flex;
            align-items: center;
            padding: 3px 5px;
            background: var(--blue);
            color: var(--white);
            font-weight: bold;
        }

        .titulo img {
            width: 16px;
            height: 16px;
            margin-right: 6px;
        }

        .consola {
            flex: 1;
            overflow-y: auto;
            margin: 6px 0;
            padding: 8px;
            background: var(--white);
            border-top: 2px solid var(--dark);
            border-left: 2px solid var(--dark);
            border-right: 2px solid var(--white);
            border-bottom: 2px solid var(--white);
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.45;
        }

        .mensaje { margin-bottom: 8px; overflow-wrap: anywhere; }
        .usuario { color: #008000; }
        .asistente { color: #111; }

        .imagen-mensaje {
            display: block;
            max-width: min(100%, 320px);
            max-height: 240px;
            margin: 5px 0 0 4px;
            object-fit: contain;
        }

        .compositor { display: grid; gap: 5px; }

        .vista-previa {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            padding: 5px;
            background: var(--white);
            border: 1px solid var(--dark);
        }

        .vista-previa[hidden] { display: none; }

        .vista-previa img {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            object-fit: cover;
        }

        .detalle-imagen { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .estado-imagen { min-height: 14px; color: #800000; }

        .caja {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            height: 30px;
            padding: 5px;
            border-top: 2px solid var(--dark);
            border-left: 2px solid var(--dark);
            border-right: 2px solid var(--white);
            border-bottom: 2px solid var(--white);
            font-family: "Courier New", monospace;
            font-size: 12px;
            outline: none;
        }

        button {
            min-width: 75px;
            background: var(--gray);
            border-top: 2px solid var(--white);
            border-left: 2px solid var(--white);
            border-right: 2px solid var(--dark);
            border-bottom: 2px solid var(--dark);
            font-family: "MS Sans Serif", Tahoma, sans-serif;
            cursor: pointer;
        }

        button:active {
            border-top: 2px solid var(--dark);
            border-left: 2px solid var(--dark);
            border-right: 2px solid var(--white);
            border-bottom: 2px solid var(--white);
        }

        #btnImagen { min-width: 36px; font-size: 20px; line-height: 1; }
        #btnQuitarImagen { min-width: 30px; height: 30px; }
        #selectorImagen { display: none; }

        @media (max-width: 500px) {
            .caja { gap: 4px; }
            .caja button { min-width: 58px; height: 30px; }
            #btnImagen { min-width: 36px; }
        }
    </style>
</head>
<body>
    <div class="ventana">
        <div class="titulo">
            <img src="icon.ico" onerror="this.style.display='none'" alt="">
            WindowSystem.exe
        </div>

        <div class="consola" id="consola" role="log" aria-live="polite"></div>

        <div class="compositor">
            <div class="vista-previa" id="vistaPrevia" hidden>
                <img id="miniaturaImagen" alt="Vista previa de la imagen">
                <div class="detalle-imagen">
                    <div id="nombreImagen"></div>
                    <div id="tamanoImagen"></div>
                </div>
                <button id="btnQuitarImagen" type="button" aria-label="Quitar imagen">×</button>
            </div>
            <div class="estado-imagen" id="estadoImagen" role="status" aria-live="polite"></div>
            <div class="caja">
                <input type="file" id="selectorImagen" accept="image/*">
                <button id="btnImagen" type="button" aria-label="Adjuntar imagen" title="Adjuntar imagen">+</button>
                <input type="text" id="txtInput" autocomplete="off" placeholder="Escribe un mensaje..." aria-label="Mensaje">
                <button id="btnEnviar" type="button">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        var nombreAsistente = "WindowSystem";
        var turnos = 0;
        var modoMonologo = false;
        var timerMonologo = null;
        var imagenSeleccionada = null;
        var urlImagenSeleccionada = null;
        var urlsImagenesEnviadas = [];
        var limiteImagenBytes = 500 * 1024 * 1024;

        var memoria = {
            nombre: "",
            ultimoTema: "",
            estadoAnimo: "neutral",
            temasHablandos: []
        };

        var conceptos = {
            juegos: ["juego", "jugar", "partida", "ganar", "perder", "consola", "minecraft", "roblox", "fortnite", "videojuego", "steam"],
            videos: ["video", "youtube", "vlc", "pelicula", "película", "serie", "anime", "cine", "netflix"],
            tecnologia: ["programar", "codigo", "código", "github", "pc", "computadora", "windows", "script", "javascript", "html", "css", "python"],
            tareas: ["tarea", "escuela", "trabajo", "estudiar", "deberes", "examen", "proyecto", "profesor"],
            comida: ["comida", "comer", "hambre", "almuerzo", "cena", "pizza", "restaurante", "receta"],
            deporte: ["deporte", "ejercicio", "futbol", "fútbol", "baloncesto", "gimnasio", "correr", "caminar"],
            musica: ["musica", "música", "cancion", "canción", "artista", "cantar", "spotify", "rock", "banda"]
        };

        var plantillas = {
            saludos: [
                "Hola de nuevo. ¿Qué estabas haciendo?",
                "¡Hey! Aquí sigo esperando tus mensajes. ¿Qué cuentas?",
                "Saludos terrenales. ¿Cómo va tu día?",
                "Hola. Acabo de procesar una nueva conversación contigo.",
                "Buenas. ¿Cómo estás hoy?"
            ],
            juegos: [
                "F por tu partida si perdiste, pero si ganaste: ¡qué grande! ¿Qué estás jugando?",
                "Los videojuegos tienen sus propias reglas. ¿Cuál es tu favorito?",
                "¿Pruebas algo nuevo o sigues jugando tu clásico?",
                "La próxima vez que ganes una partida, recuerda que yo fui tu compañero en el lobby.",
                "Si estás aburrido, una partida corta puede funcionar. ¿Minecraft, Roblox o Fortnite?"
            ],
            videos: [
                "Buena idea, ¿qué película o serie tienes en mente?",
                "Podemos recomendar opciones según el género: terror, comedia, ciencia ficción o anime.",
                "¿Prefieres una serie larga o una película rápida?",
                "Los mejores videos son los que te hacen olvidar el reloj. ¿Qué estás viendo?",
                "Puedes poner música de fondo y seguir escribiendo conmigo."
            ],
            tecnologia: [
                "La tecnología siempre tiene otro problema nuevo esperando ser resuelto. ¿Qué estás creando?",
                "GitHub es perfecto para compartir proyectos y aprender de otros. ¿Qué lenguaje usas?",
                "Yo soy un asistente HTML básico, pero puedo hablar de JavaScript, HTML, CSS y Python.",
                "Si tienes un error, dividirlo en partes pequeñas suele ayudar. ¿Qué parte falla?",
                "¿Estás aprendiendo o ya tienes un proyecto avanzado?"
            ],
            estado_bien: [
                "Me alegra que estés bien. ¿Qué hiciste hoy?",
                "¡Qué bueno! Cuando la energía está arriba, es buen momento para empezar algo nuevo.",
                "Perfecto. Aprovechando ese estado, ¿qué quieres hacer ahora?",
                "Eso suena bien. Yo estoy listo para seguir conversando.",
                "Excelente. Cuéntame qué fue lo mejor de tu día."
            ],
            estado_mal: [
                "Lo siento. Si quieres, cuéntame qué pasó o intentemos distraerte.",
                "Ánimo. No tienes que resolverlo todo de inmediato. ¿Quieres hablar o descansar?",
                "Entiendo. Puedes tomarte un momento y respirar despacio. Estoy aquí.",
                "A veces ayuda escribir lo que molesta. Yo puedo escucharte.",
                "Lo siento mucho. ¿Prefieres consejo, distracción o silencio?"
            ],
            tareas: [
                "Las tareas pesan menos si las divides en pasos pequeños. ¿Cuál necesitas hacer primero?",
                "Prueba el método Pomodoro: 25 minutos trabajando y 5 descansando.",
                "Haz primero la tarea más fácil para ganar impulso.",
                "¿Te falta tiempo o no sabes por dónde empezar?",
                "Organiza tus tareas por fecha límite y dificultad."
            ],
            comida: [
                "El tema de la comida siempre mejora una conversación. ¿Qué te gusta comer?",
                "¿Te apetece cocinar o pedir algo?",
                "La pizza es una respuesta válida para casi cualquier problema.",
                "¿Has probado una receta nueva últimamente?",
                "Primero come algo, luego seguimos resolviendo el mundo."
            ],
            deporte: [
                "El movimiento ayuda a despejar la cabeza. ¿Qué deporte practicas?",
                "Una caminata corta puede servir si no tienes tiempo para entrenar.",
                "¿Prefieres entrenar solo o con amigos?",
                "Respira, hidrátate y calienta antes de hacer ejercicio.",
                "No hace falta correr una maratón para empezar; diez minutos ya cuentan."
            ],
            musica: [
                "La música cambia completamente el ambiente. ¿Qué estás escuchando?",
                "¿Te gusta descubrir artistas nuevos o escuchar favoritos?",
                "Cuéntame un género y te puedo sugerir cómo crear una lista.",
                "¿Prefieres música para concentrarte o para animarte?",
                "Una buena canción puede reiniciar una tarde aburrida."
            ],
            gracias: [
                "De nada. Siempre puedo seguir conversando contigo.",
                "Con gusto. ¿Qué más quieres hacer?",
                "No hay problema. Para eso estoy aquí.",
                "¡Un placer!"
            ],
            despedidas: [
                "Hasta luego. Espero verte pronto.",
                "Nos vemos. No olvides cerrar tus tareas pendientes.",
                "Fue bueno conversar contigo. Hasta la próxima.",
                "Adiós. Mantén tu ventana abierta por si vuelves."
            ],
            ayuda: [
                "Puedo conversar sobre juegos, videos, tecnología, tareas, comida, deporte y música. También recuerdo tu nombre.",
                "Prueba: 'me llamo Ana', 'estoy triste', 'quiero programar', 'monologo', 'ayuda' o 'salir'.",
                "Comandos disponibles: ayuda, monologo, parar, mi nombre, salir y exit."
            ],
            desconocido: [
                "Interesante. Cuéntame más sobre eso.",
                "No estoy seguro de entender, pero puedo seguir escuchando.",
                "Mis circuitos antiguos necesitan más detalles. ¿Puedes explicar qué quieres decir?",
                "Anotado en mi memoria. ¿Qué pasó después?",
                "Eso suena importante. ¿Qué te gustaría hacer al respecto?",
                "No tengo una respuesta exacta, pero podemos encontrar una opción juntos.",
                "Cuéntame un poco más y te responderé con lo que tengo."
            ]
        };

        function elegir(lista) {
            return lista[Math.floor(Math.random() * lista.length)];
        }

        function contienePalabras(texto, lista) {
            for (var i = 0; i < lista.length; i++) {
                if (texto.indexOf(lista[i]) !== -1) return true;
            }
            return false;
        }

        function registrarTema(tema) {
            memoria.ultimoTema = tema;
            memoria.estadoAnimo = tema;
            if (memoria.temasHablandos.indexOf(tema) === -1) {
                memoria.temasHablandos.push(tema);
            }
        }

        function generarRespuesta(entrada) {
            var texto = entrada.toLowerCase().replace(/[¿?¡!.,]/g, " ").replace(/\s+/g, " ").trim();

            if (contienePalabras(texto, ["hola", "buenas", "hey", "buenos dias", "buenas tardes", "buenas noches"])) {
                return elegir(plantillas.saludos);
            }

            if (contienePalabras(texto, ["gracias", "muchas gracias", "te agradezco"])) {
                return elegir(plantillas.gracias);
            }

            if (contienePalabras(texto, ["adios", "adiós", "hasta luego", "nos vemos", "bye", "chao"])) {
                return elegir(plantillas.despedidas);
            }

            if (contienePalabras(texto, ["ayuda", "comandos", "que puedes hacer", "qué puedes hacer"])) {
                return elegir(plantillas.ayuda);
            }

            if (texto.indexOf("me llamo") !== -1) {
                var partes = entrada.trim().split(/\s+/);
                memoria.nombre = partes[partes.length - 1].replace(/[,.;]/g, "");
                return "Un placer conocerte, " + memoria.nombre + ". Recordaré tu nombre en esta conversación. ¿A qué te dedicas?";
            }

            if (texto.indexOf("mi nombre") !== -1 || texto.indexOf("como me llamo") !== -1) {
                return memoria.nombre
                    ? "Te llamas " + memoria.nombre + "."
                    : "Aún no me has dicho tu nombre. Prueba con 'me llamo...'";
            }

            if (texto.indexOf("quien eres") !== -1 || texto.indexOf("qué eres") !== -1 || texto.indexOf("que eres") !== -1) {
                return "Soy WindowSystem, un asistente de conversación hecho con HTML y JavaScript. Puedo recordar tu nombre y varios temas mientras esta página esté abierta.";
            }

            var categorias = ["juegos", "videos", "tecnologia", "tareas", "comida", "deporte", "musica"];
            for (var i = 0; i < categorias.length; i++) {
                var categoria = categorias[i];
                if (contienePalabras(texto, conceptos[categoria])) {
                    registrarTema(categoria);
                    return elegir(plantillas[categoria]);
                }
            }

            if (contienePalabras(texto, ["bien", "feliz", "contento", "contenta", "genial", "excelente", "emocionado"])) {
                memoria.estadoAnimo = "bien";
                return elegir(plantillas.estado_bien);
            }

            if (contienePalabras(texto, ["mal", "triste", "cansado", "cansada", "aburrido", "aburrida", "estresado", "estresada", "deprimido", "solo"])) {
                memoria.estadoAnimo = "mal";
                return elegir(plantillas.estado_mal);
            }

            var respuesta = elegir(plantillas.desconocido);
            if (turnos % 4 === 0) {
                respuesta += " Puedes escribir 'ayuda' para ver lo que puedo hacer.";
            }
            return respuesta;
        }

        function Log(quien, mensaje, urlImagen) {
            var consola = document.getElementById("consola");
            var clase = quien === "Tú" ? "usuario" : "asistente";
            var linea = document.createElement("div");
            linea.className = "mensaje " + clase;
            linea.innerHTML = "<b>" + quien + ">&nbsp;</b>";
            linea.appendChild(document.createTextNode(mensaje));
            if (urlImagen) {
                var imagen = document.createElement("img");
                imagen.className = "imagen-mensaje";
                imagen.src = urlImagen;
                imagen.alt = "Imagen adjunta";
                linea.appendChild(imagen);
            }
            consola.appendChild(linea);
            consola.scrollTop = consola.scrollHeight;
        }

        function procesar(entrada) {
            turnos++;
            var texto = entrada.toLowerCase().trim();

            if (texto === "salir" || texto === "exit") {
                Log(nombreAsistente, "Cerrando sistema. ¡Hasta pronto!");
                setTimeout(function () { window.close(); }, 1500);
                return;
            }

            if (texto === "monologo") {
                if (!modoMonologo) {
                    modoMonologo = true;
                    Log(nombreAsistente, "Monólogo infinito activado. Escribe 'parar' para detenerlo.");
                    timerMonologo = setInterval(function () {
                        if (modoMonologo) Log(nombreAsistente, generarRespuesta("monologo"));
                    }, 2000);
                } else {
                    Log(nombreAsistente, "El monólogo ya está activo. Escribe 'parar' para detenerlo.");
                }
                return;
            }

            if (texto === "parar") {
                if (modoMonologo) {
                    modoMonologo = false;
                    clearInterval(timerMonologo);
                    Log(nombreAsistente, "Monólogo detenido. Seguimos con conversación normal.");
                } else {
                    Log(nombreAsistente, "No había ningún monólogo activo.");
                }
                return;
            }

            Log(nombreAsistente, generarRespuesta(entrada));
        }

        function limpiarImagenSeleccionada() {
            if (urlImagenSeleccionada) URL.revokeObjectURL(urlImagenSeleccionada);
            imagenSeleccionada = null;
            urlImagenSeleccionada = null;
            document.getElementById("selectorImagen").value = "";
            document.getElementById("vistaPrevia").hidden = true;
            document.getElementById("miniaturaImagen").removeAttribute("src");
            document.getElementById("nombreImagen").textContent = "";
            document.getElementById("tamanoImagen").textContent = "";
        }

        function seleccionarImagen(evento) {
            var archivo = evento.target.files[0];
            var estado = document.getElementById("estadoImagen");
            estado.textContent = "";
            if (!archivo) return;

            if (!archivo.type || archivo.type.indexOf("image/") !== 0) {
                limpiarImagenSeleccionada();
                estado.textContent = "Elige un archivo de imagen válido.";
                return;
            }

            if (archivo.size > limiteImagenBytes) {
                limpiarImagenSeleccionada();
                estado.textContent = "La imagen supera el límite de 500 MB.";
                return;
            }

            limpiarImagenSeleccionada();
            imagenSeleccionada = archivo;
            urlImagenSeleccionada = URL.createObjectURL(archivo);
            document.getElementById("miniaturaImagen").src = urlImagenSeleccionada;
            document.getElementById("nombreImagen").textContent = archivo.name;
            document.getElementById("tamanoImagen").textContent = (archivo.size / (1024 * 1024)).toFixed(2) + " MB";
            document.getElementById("vistaPrevia").hidden = false;
        }

        function enviarMensaje() {
            var input = document.getElementById("txtInput");
            var texto = input.value.trim();
            if (texto === "" && !imagenSeleccionada) return;

            var urlImagen = null;
            if (imagenSeleccionada) {
                urlImagen = urlImagenSeleccionada;
                urlsImagenesEnviadas.push(urlImagen);
                Log("Tú", texto || "Imagen adjunta: " + imagenSeleccionada.name, urlImagen);
                limpiarImagenSeleccionada();
            } else {
                Log("Tú", texto);
            }

            input.value = "";
            if (texto !== "") procesar(texto);
            input.focus();
        }

        document.getElementById("btnImagen").addEventListener("click", function () {
            document.getElementById("selectorImagen").click();
        });
        document.getElementById("selectorImagen").addEventListener("change", seleccionarImagen);
        document.getElementById("btnQuitarImagen").addEventListener("click", limpiarImagenSeleccionada);
        document.getElementById("btnEnviar").addEventListener("click", enviarMensaje);
        document.getElementById("txtInput").addEventListener("keydown", function (evento) {
            if (evento.key === "Enter") enviarMensaje();
        });
        window.addEventListener("beforeunload", function () {
            urlsImagenesEnviadas.forEach(function (url) { URL.revokeObjectURL(url); });
            if (urlImagenSeleccionada) URL.revokeObjectURL(urlImagenSeleccionada);
        });

        window.onload = function () {
            Log(nombreAsistente, "Hola, soy WindowSystem 2.0. Escribe 'ayuda' para ver qué puedo hacer.");
            document.getElementById("txtInput").focus();
        };
    </script>
</body>
</html>
